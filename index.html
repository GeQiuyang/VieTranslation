<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MakeDeal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />
  <style>
    .material-symbols-outlined { visibility: hidden; }
    .fonts-loaded .material-symbols-outlined { visibility: visible; }
  </style>
  <script>
    (function(){var t=localStorage.getItem('app_theme');if(t)document.documentElement.setAttribute('data-theme',t)})()
    document.fonts.ready.then(function(){document.body.classList.add('fonts-loaded')})
    setTimeout(function(){document.body.classList.add('fonts-loaded')},3000)
  </script>
</head>
<body class="bg-background text-on-background min-h-screen">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
